# Configuración común de calidad para todos los proyectos del portafolio.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["soc_agentes"]

[tool.ruff.format]
quote-style = "double"
